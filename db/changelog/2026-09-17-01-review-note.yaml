databaseChangeLog:
  - changeSet:
      id: daily-office-005-review-note
      author: royajafari
      comment: Reviewer's note (esp. rejection reason), visible to the requester via GET /requests/:id
      changes:
        - addColumn:
            tableName: office_requests
            columns:
              - column:
                  name: review_note
                  type: VARCHAR2(4000)
      rollback:
        - dropColumn:
            tableName: office_requests
            columnName: review_note
